name: Playwright E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Install Playwright Browsers
        run: |
          SCRIPT_PATH=$(find PlaywrightTests/bin -name "playwright.ps1" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "playwright.ps1 not found"
            exit 1
          fi
          pwsh "$SCRIPT_PATH" install --with-deps

      - name: Start ASP.NET Core Server
        run: |
          dotnet run --project LR2WebDesign/LR2WebDesign.csproj --configuration Release --no-build --urls "http://localhost:5000" &
          
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run Playwright tests
        run: dotnet test PlaywrightTests/PlaywrightTests.csproj --configuration Release --no-build
        env:
          BASE_URL: http://localhost:5000
