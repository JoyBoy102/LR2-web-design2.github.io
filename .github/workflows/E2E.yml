name: Playwright E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Убедитесь, что версия совпадает с вашим проектом

      # 1. Сборка всего решения в Release
      - name: Build solution
        run: dotnet build --configuration Release

      # 2. Установка браузеров Playwright
      - name: Install Playwright Browsers
        run: |
          SCRIPT_PATH=$(find PlaywrightTests/bin -name "playwright.ps1" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "playwright.ps1 не найден. Проверьте, что пакет Microsoft.Playwright установлен."
            exit 1
          fi
          pwsh "$SCRIPT_PATH" install --with-deps

      # 3. Запуск ASP.NET Core сервера на HTTPS порту 7280
      - name: Start ASP.NET Core Server
        run: |
          # Генерируем локальный сертификат для CI окружения
          dotnet dev-certs https
          
          # Запускаем сервер в фоне
          dotnet run --project LR2WebDesign/LR2WebDesign.csproj --configuration Release --no-build --urls "https://localhost:7280" &
          
          echo "Ожидаем запуска сервера на https://localhost:7280..."
          # Ждем до 60 секунд. Флаг -k в curl нужен, чтобы игнорировать самоподписанный сертификат
          for i in {1..60}; do
            if curl -k -s https://localhost:7280 > /dev/null; then
              echo "Сервер успешно запущен!"
              exit 0
            fi
            sleep 1
          done
          echo "Ошибка: Сервер не запустился за 60 секунд."
          exit 1

      # 4. Запуск тестов ТОЛЬКО для проекта PlaywrightTests
      - name: Run Playwright tests
        run: dotnet test PlaywrightTests/PlaywrightTests.csproj --configuration Release --no-build

      # 5. Сохранение артефактов (видео/скриншотов) если тесты упали
      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            PlaywrightTests/bin/Release/net10.0/videos/
            PlaywrightTests/bin/Release/net10.0/test-results/
          retention-days: 7
