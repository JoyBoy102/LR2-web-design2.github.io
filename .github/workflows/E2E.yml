name: Playwright E2E Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Укажите вашу версию .NET

      - name: Build solution
        run: dotnet build --configuration Release

      - name: Build test project
        run: dotnet build PlaywrightTests/PlaywrightTests.csproj --configuration Debug

      - name: Ensure browsers are installed
        run: |
          SCRIPT_PATH=$(find PlaywrightTests/bin -name "playwright.ps1" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "playwright.ps1 not found. Check that Microsoft.Playwright package is referenced."
            exit 1
          fi
          pwsh "$SCRIPT_PATH" install --with-deps

      - name: Run ASP.NET Core App
        run: |
          dotnet run --project LR2WebDesign/LR2WebDesign.csproj --configuration Release --no-build --urls "http://localhost:5000" &
          npx wait-on http://localhost:5000 --timeout 60000
          
      - name: Run Playwright tests
        run: dotnet test --no-build --configuration Release
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5000
          
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/PlaywrightTests/playwright-report/
          retention-days: 30
