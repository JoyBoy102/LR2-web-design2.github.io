<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="stylesheet" href="css/login-form-style.css">
</head>
<body>
    <div class="container">
        <main>
            <h1>Авторизация</h1>
            <form class="login-form">
                <input class="login-input" placeholder="Логин или почта" />
                <input class="password-input" placeholder="Пароль" type="password" />
                <label class="input-label">
                    <input class="input-checkbox" type="checkbox" name="remember">
                    Запомнить пароль
                </label>

                <div class="submit-btn-block">
                    <button type="submit" class="submit-btn">Войти</button>
                </div>
            </form>
            <div class="additinal-btns">
                <span><a href="registration.html">Регистрация</a> | <a>Забыли пароль?</a></span>
                <span><a href="index.html">← Вернуться назад</a></span>
            </div>
        </main>
    </div>
</body>
</html>
