<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link rel="preload" href="css/login-form-style.css" as="style">
    <link rel="stylesheet" href="css/login-form-style.css">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js" defer></script>

    <script src="js/login-form-script.js" defer></script>

    <script type="text/javascript">
    </script>

</head>
<body>
    <div class="container">
        <main>
            <h1>Авторизация</h1>
            <form class="login-form">
                <input class="login-or-email-input" placeholder="Логин или почта" data-testid="login-or-email-input" />
                <input class="password-input" placeholder="Пароль" type="password" data-testid="password-input" />
                <label class="input-label">
                    <input class="input-checkbox" type="checkbox" name="remember">
                    Запомнить пароль
                </label>

                <div class="submit-btn-block">
                    <button type="submit" class="submit-btn" data-testid="submit-btn">Войти</button>
                </div>
            </form>
            <div class="additinal-btns">
                <span><a data-testid="reg-ref" href="/registration" class="reg-ref">Регистрация</a> | <a>Забыли пароль?</a></span>
                <span><a href="/">← Вернуться назад</a></span>
            </div>
        </main>
    </div>
</body>
</html>
