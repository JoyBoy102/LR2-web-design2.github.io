<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/registration-form-style.css">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>

    <script src="js/registration-form-script.js" defer></script>
</head>
<body>
    <div class="container">
        <main>
            <h1>Регистрация</h1>
            <form class="registration-form">
                <!-- Рекомендую добавить type="email" для почты -->
                <input class="email-input" placeholder="Почта" type="email" data-testid="email-input"/>
                <input class="login-input" placeholder="Логин" data-testid="login-input"/>
                <input class="password-input" placeholder="Пароль" type="password" data-testid="password-input"/>

                <div class="submit-btn-block">
                    <button type="button" class="submit-btn" data-testid="submit-btn">Зарегистрироваться</button>
                </div>
            </form>
            <div class="additinal-btns">
                <span><a href="index.html">← Вернуться назад</a></span>
            </div>
        </main>
    </div>
</body>
</html>
